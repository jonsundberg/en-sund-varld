<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Bakgrund -->
  <rect width="1200" height="630" fill="#1d3a37"/>

  <!-- Subtil textur – diagonala linjer -->
  <pattern id="lines" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#lines)"/>

  <!-- Vänster accent-linje -->
  <rect x="80" y="80" width="4" height="470" fill="#1a7a72" rx="2"/>

  <!-- SVG-emblem (förenklat) -->
  <g transform="translate(920, 315)">
    <circle cx="0" cy="0" r="140" stroke="#1a7a72" stroke-width="1.5" stroke-dasharray="8 5" fill="none" opacity="0.4"/>
    <circle cx="0" cy="0" r="105" stroke="#1a7a72" stroke-width="1" fill="none" opacity="0.25"/>
    <!-- Stam -->
    <line x1="0" y1="75" x2="0" y2="20" stroke="#2a9e94" stroke-width="3" stroke-linecap="round"/>
    <!-- Blad vänster -->
    <path d="M0 50 C-30 25 -60 30 -55 5 C-35 10 -10 28 0 50Z" fill="#2a9e94" opacity="0.7"/>
    <!-- Blad höger -->
    <path d="M0 38 C30 15 60 20 55 -5 C35 0 8 18 0 38Z" fill="#1a7a72" opacity="0.85"/>
    <!-- Topp -->
    <path d="M0 20 C0 -5 -15 -22 -15 -40 C-5 -33 5 -18 0 20Z" fill="#2a9e94" opacity="0.9"/>
    <!-- Rötter -->
    <line x1="0" y1="75" x2="-18" y2="95" stroke="#7a6048" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="0" y1="75" x2="18" y2="97" stroke="#7a6048" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Rubrik -->
  <text x="120" y="270" font-family="Georgia, serif" font-size="68" font-weight="bold" fill="#f0f4f3" letter-spacing="-1">En sund värld</text>

  <!-- Underrubrik -->
  <text x="120" y="330" font-family="Georgia, serif" font-size="28" fill="#2a9e94" letter-spacing="1">Ekonomisk Förening</text>

  <!-- Beskrivning -->
  <text x="120" y="400" font-family="Arial, sans-serif" font-size="22" fill="rgba(240,244,243,0.65)">Vi vårdar jorden och bygger hållbara livsmiljöer.</text>

  <!-- Webbadress -->
  <text x="120" y="520" font-family="Arial, sans-serif" font-size="18" fill="rgba(240,244,243,0.35)" letter-spacing="0.5">ensundvarld.se</text>
</svg>
